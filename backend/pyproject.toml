[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--strict-markers"
markers = [
    "unit: pruebas sin infraestructura externa",
    "integration: pruebas contra PostgreSQL real",
]